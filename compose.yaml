# Local stack: api_gateway on http://localhost:8080.
# Needs auth_service's and Blob_storage's stacks running first; this joins
# their shared "blob-storage" network and reaches them by service name.
name: api-gateway

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_URL: http://auth:4000
      BLOB_URL: http://blob:3000
      CORS_ORIGIN: http://localhost:5173
      # Browsers reach the gateway through blob_frontend's server, which
      # appends the browser's address to X-Forwarded-For.
      TRUST_PROXY: "true"
    networks:
      - blob-storage

networks:
  blob-storage:
    external: true
